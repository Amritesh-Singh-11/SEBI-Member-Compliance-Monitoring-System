version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sebi_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:root}
      MYSQL_DATABASE: ${DB_NAME:sebi_compliance}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sebi_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sebi_compliance
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:root}
      JWT_SECRET: ${JWT_SECRET:dGhpc0lzQVNlY3VyZVNlY3JldEtleUZvclNFQklDT01QTElBTkNFUmVnVGVjaFByb3RvdHlwZTIwMjY=}
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sebi_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sebi_ml_service
    ports:
      - "8000:8000"

volumes:
  mysql_data:
